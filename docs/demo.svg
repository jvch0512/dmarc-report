<svg xmlns="http://www.w3.org/2000/svg" width="860" height="418" viewBox="0 0 860 418" role="img" aria-label="Terminal replay of dmarc-report on its sample data"><style>text{font:14px ui-monospace,Menlo,Consolas,monospace;fill:#d6deeb}.p{fill:#7fdbca}.c{fill:#ecc48d}.h{fill:#ff6b6b}.m{fill:#f78c6c}.l{fill:#82aaff}.i{fill:#8a96a8}@keyframes t{from{opacity:0}to{opacity:1}}.r{animation:t .01s backwards}.d0{animation-delay:0.40s}.d1{animation-delay:0.75s}.d2{animation-delay:1.10s}.d3{animation-delay:1.45s}.d4{animation-delay:1.80s}.d5{animation-delay:2.15s}.d6{animation-delay:2.50s}.d7{animation-delay:2.85s}.d8{animation-delay:3.20s}.d9{animation-delay:3.55s}.d10{animation-delay:3.90s}.d11{animation-delay:4.25s}.d12{animation-delay:4.60s}</style><rect width="860" height="418" rx="10" fill="#011627"/><rect width="860" height="34" rx="10" fill="#0b2942"/><circle cx="20" cy="17" r="6" fill="#ff5f56"/><circle cx="40" cy="17" r="6" fill="#ffbd2e"/><circle cx="60" cy="17" r="6" fill="#27c93f"/><text x="430" y="22" text-anchor="middle" class="i">dmarc-report</text><text x="20" y="64" xml:space="preserve"><tspan class="p">$ </tspan>./bin/dmarc-report examples/reports</text><text class="r d0 " x="20" y="108" xml:space="preserve">2 reports, 6 findings</text><text class="r d1 h" x="20" y="130" xml:space="preserve">HIGH DMARC101 198.51.100.77</text><text class="r d2 " x="20" y="152" xml:space="preserve">          20 messages failed SPF and DKIM alignment and were delivered anyway (20 in total from this sou</text><text class="r d3 m" x="20" y="174" xml:space="preserve">MEDIUM DMARC102 192.0.2.25</text><text class="r d4 " x="20" y="196" xml:space="preserve">          35 of 35 messages pass through SPF only: forwarding will break alignment, add DKIM signing</text><text class="r d5 m" x="20" y="218" xml:space="preserve">MEDIUM DMARC101 198.51.100.200</text><text class="r d6 " x="20" y="240" xml:space="preserve">          3 messages failed SPF and DKIM alignment (blocked by the receiver)</text><text class="r d7 m" x="20" y="262" xml:space="preserve">MEDIUM DMARC102 203.0.113.9</text><text class="r d8 " x="20" y="284" xml:space="preserve">          250 of 250 messages pass through DKIM only: SPF is not aligned, check the envelope sender</text><text class="r d9 m" x="20" y="306" xml:space="preserve">MEDIUM DMARC103 example.test</text><text class="r d10 " x="20" y="328" xml:space="preserve">          policy is p=none (monitoring only) while 20 messages that fail alignment are delivered</text><text class="r d11 i" x="20" y="350" xml:space="preserve">INFO DMARC105 example.test</text><text class="r d12 " x="20" y="372" xml:space="preserve">          97.8% of 1038 messages pass DMARC (policy p=none)</text></svg>
